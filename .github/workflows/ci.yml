# Build and test on every push to main and every pull request.
# GitHub's Ubuntu runners have Docker, so the Testcontainers integration tests (*IT), which are skipped on
# a laptop without Docker, always run here. The Docker image is built here too (the laptop has no Docker);
# deploy.yml pushes and deploys it after this workflow passes on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Unit and integration tests
        run: ./mvnw -B -ntp verify

      - name: Fail if integration tests were skipped
        # Guards against a silent pass: if Docker were missing, every *IT would be skipped, not failed.
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' target/failsafe-reports/TEST-*.xml | awk -F'"' '{s+=$2} END {print s+0}')
          total=$(grep -ho 'tests="[0-9]*"' target/failsafe-reports/TEST-*.xml | awk -F'"' '{s+=$2} END {print s+0}')
          echo "Integration tests: $total run, $skipped skipped"
          test "$total" -gt 0 && test "$skipped" -eq 0

      - name: Docker image builds
        run: docker build --tag earlybird:ci .

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

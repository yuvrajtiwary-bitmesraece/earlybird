# Render Blueprint (spec section 10): one free web service in Singapore, running the image CI pushes to GitHub's
# container registry. deploy.yml triggers each deploy through the service's deploy hook with the new image's tag.
# Secrets are declared with sync: false, so Render asks for them in its dashboard; they never live in Git.
services:
  - type: web
    name: earlybird
    runtime: image
    image:
      url: ghcr.io/yuvrajtiwary-bitmesraece/earlybird:latest
    plan: free
    region: singapore
    healthCheckPath: /actuator/health/readiness
    envVars:
      # Not secret
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EARLYBIRD_ENV
        value: prod
      - key: EARLYBIRD_ROLES
        value: web,bot,poller,enricher,matcher,notifier,scheduler
      - key: DB_SCHEMA
        value: earlybird
      - key: EVENT_BUS
        value: kafka
      - key: KAFKA_SECURITY_PROTOCOL
        value: SSL
      - key: KAFKA_TOPIC_PREFIX
        value: eb.
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_BOT_USERNAME
        value: EarlyBirdJobsBot
      - key: SCHEDULER_MODE
        value: external
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MAX_CALLS_PER_DAY
        value: "400"
      # Secret or deployment-specific: entered in the Render dashboard
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SSL_CA_PEM
        sync: false
      - key: KAFKA_SSL_CERT_PEM
        sync: false
      - key: KAFKA_SSL_KEY_PEM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: METRICS_TOKEN
        sync: false

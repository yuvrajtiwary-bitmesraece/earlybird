# Integration tests. The database comes from Testcontainers (@ServiceConnection); job boards, Telegram and
# Gemini are an in-process WireMock (see TestcontainersConfiguration). Dummy values satisfy config validation.
# No real secrets, and no calls to real services.
earlybird:
  env: test
  # No scheduler role: tests trigger checks themselves, nothing runs on a timer.
  roles: web,bot,poller,enricher,matcher,notifier
  db-schema: earlybird
  public-base-url: https://earlybird.test
  telegram:
    bot-token: "123456:test-token"
    bot-username: EarlyBirdTestBot
    # Webhook mode, so tests drive the bot exactly as Telegram does in production.
    mode: webhook
    webhook-secret: it-webhook-secret-0123456789abcdefghijklmnop
  gemini:
    api-key: test-gemini-key
    model: gemini-test
  sources:
    # Don't load the ~130 real seed boards into the test database.
    seed-file: ""
